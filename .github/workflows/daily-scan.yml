name: Daily NSE scan

on:
  schedule:
    # 19:00 IST (UTC+5:30) = 13:30 UTC, Monday-Friday
    - cron: "30 13 * * 1-5"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python run_scan.py

      - uses: actions/upload-artifact@v4
        with:
          name: scan-${{ github.run_id }}
          path: ChartsParadise_Scan_*.zip
          retention-days: 30
