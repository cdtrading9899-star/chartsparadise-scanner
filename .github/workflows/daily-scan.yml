name: Daily NSE scan

on:
  schedule:
    # Monday-Friday evenings, after the NSE bhavcopy is out (the scan treats a run after 16:00 IST as that day's
    # session). Run early so GitHub's multi-hour schedule delays still land before the next morning.
    # Two slots: only the first run per session sends the alert (state/emailed_session.txt).
    - cron: "30 14 * * 1-5"   # 20:00 IST Mon-Fri
    - cron: "30 15 * * 1-5"   # 21:00 IST Mon-Fri, backup
  workflow_dispatch:
    inputs:
      force_email:
        description: "Send the email even if this session was already emailed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-scan          # runs queue one after another, so the backup sees the first run's marker
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python run_scan.py

      - run: python make_report.py

      - name: Send the watchlist (email + Telegram)
        continue-on-error: true   # still commit results/marker if a channel fails
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: cdtrading9899@gmail.com
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_EMAIL: ${{ inputs.force_email && '1' || '' }}
        run: python send_email.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if [ -d state ]; then git add state; fi
          git diff --staged --quiet || git commit -m "Scan results $(date -u +%F)"
          git pull --rebase -q && git push

      - uses: actions/upload-artifact@v4
        with:
          name: scan-${{ github.run_id }}
          path: ChartsParadise_Scan_*.zip
          retention-days: 30
