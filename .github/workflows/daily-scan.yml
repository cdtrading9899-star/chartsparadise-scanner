name: Daily NSE scan

on:
  schedule:
    # Monday-Friday mornings, before the 6:00 IST email deadline. Each run scans the last closed session.
    # Two slots because GitHub can start scheduled runs late; only the first run per session sends the email.
    - cron: "17 22 * * 0-4"   # 03:47 IST Mon-Fri (22:17 UTC Sun-Thu)
    - cron: "47 23 * * 0-4"   # 05:17 IST Mon-Fri (23:47 UTC Sun-Thu), backup
  workflow_dispatch:
    inputs:
      force_email:
        description: "Send the email even if this session was already emailed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-scan          # runs queue one after another, so the backup sees the first run's marker
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python run_scan.py

      - run: python make_report.py

      - name: Email the watchlist
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: cdtrading9899@gmail.com
          FORCE_EMAIL: ${{ inputs.force_email && '1' || '' }}
        run: python send_email.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if [ -d state ]; then git add state; fi
          git diff --staged --quiet || git commit -m "Scan results $(date -u +%F)"
          git pull --rebase -q && git push

      - uses: actions/upload-artifact@v4
        with:
          name: scan-${{ github.run_id }}
          path: ChartsParadise_Scan_*.zip
          retention-days: 30
